name: Zero-Touch AUR Release Publisher

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *' # Sync with eval-exec/neomacs releases every 6 hours
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git openssh curl sudo base-devel jq

      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Extract version and prepare SSH
        env:
          AUR_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # 1. Fetch latest release from upstream eval-exec/neomacs
          LATEST_TAG=$(curl -sL https://api.github.com/repos/eval-exec/neomacs/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Could not fetch latest release from eval-exec/neomacs"
            exit 1
          fi
          VERSION="${LATEST_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Targeting upstream release version: ${VERSION}"

          # 2. Verify AUR_SSH_PRIVATE_KEY secret is present
          if [ -z "$AUR_PRIVATE_KEY" ]; then
            echo "::error::GitHub Secret 'AUR_SSH_PRIVATE_KEY' is missing or empty! Please add it in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 3. Setup SSH Key for builder user
          id -u builder &>/dev/null || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          printf '%s\n' "$AUR_PRIVATE_KEY" > /home/builder/.ssh/id_aur
          chmod 600 /home/builder/.ssh/id_aur
          if ! ssh-keygen -l -f /home/builder/.ssh/id_aur >/dev/null 2>&1; then
            echo "::error::The secret 'AUR_SSH_PRIVATE_KEY' has an invalid format! Make sure you copied the ENTIRE private key file content including header (-----BEGIN OPENSSH PRIVATE KEY-----) and footer (-----END OPENSSH PRIVATE KEY-----)."
            exit 1
          fi
          ssh-keyscan -v -H aur.archlinux.org >> /home/builder/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host aur.archlinux.org"
            echo "  User aur"
            echo "  IdentityFile /home/builder/.ssh/id_aur"
            echo "  StrictHostKeyChecking accept-new"
          } > /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh /home/builder

      - name: Update PKGBUILD and publish to AUR
        run: |
          chown -R builder:builder .

          # Clone AUR repository
          echo "==> Cloning AUR repository (neomacs-bin)..."
          if ! su builder -c "git clone ssh://aur@aur.archlinux.org/neomacs-bin.git /tmp/aur-repo"; then
            echo "::error::Failed to clone AUR repo ssh://aur@aur.archlinux.org/neomacs-bin.git. Please check that: 1) The secret 'AUR_SSH_PRIVATE_KEY' matches the public key in your AUR account, and 2) The package 'neomacs-bin' exists on AUR or you are its maintainer/co-maintainer."
            exit 1
          fi

          # Download target release tarball from upstream eval-exec/neomacs and compute SHA256
          TARBALL_URL="https://github.com/eval-exec/neomacs/releases/download/v${VERSION}/neomacs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading $TARBALL_URL ..."
          if ! curl -sL --fail "$TARBALL_URL" -o /tmp/neomacs.tar.gz; then
            echo "::error::Release tarball for version ${VERSION} not found at $TARBALL_URL"
            exit 1
          fi
          SHA256=$(sha256sum /tmp/neomacs.tar.gz | awk '{print $1}')
          echo "SHA256: $SHA256"

          # Copy base PKGBUILD to AUR repo dir
          cp PKGBUILD /tmp/aur-repo/PKGBUILD
          cd /tmp/aur-repo

          # Update version and sha256 checksums
          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i -E "0,/sha256sums=\('[a-f0-9]{64}'/s//sha256sums=\('${SHA256}'/" PKGBUILD

          # Generate .SRCINFO natively using makepkg
          chown -R builder:builder /tmp/aur-repo
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

          # Git commit & push as non-root user
          su builder -c "git config --global user.name '${{ github.actor }}'"
          su builder -c "git config --global user.email '${{ github.actor }}@users.noreply.github.com'"
          
          if su builder -c "git status --porcelain" | grep -q .; then
            su builder -c "git add PKGBUILD .SRCINFO"
            su builder -c "git commit -m 'neomacs-bin ${VERSION}-1'"
            su builder -c "git push origin master || git push origin main"
            echo "Successfully deployed neomacs-bin ${VERSION}-1 to AUR!"
          else
            echo "No changes detected. AUR is already up to date."
          fi
